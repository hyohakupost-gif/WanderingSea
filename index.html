<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app_title">漂泊ノ海 ID照会システム</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/config.js"></script>
</head>
<body>
    <div class="container">
        <h1 data-i18n="app_title">漂泊ノ海 ID照会システム</h1>
        <div class="description">
            <span data-i18n="description_part1"></span><br>
            <span data-i18n="description_part2"></span><br>
            <span id="description-tail"></span>
        </div>

        <div class="update-status" style="margin: 20px 0; font-size: 0.9em; color: var(--text-sub);">
            <p>
                <span data-i18n="status_update_label"></span>
                <span id="last-update-time">取得中...</span>
            </p>
            <p data-i18n="status_update_instruction"></p>
        </div>

        <div class="search-box">
            <input type="text" id="name" maxlength="20" data-i18n-placeholder="placeholder_name">
            <input type="text" id="title" maxlength="20" data-i18n-placeholder="placeholder_title">
            <button id="searchButton" data-i18n="button_search">手紙を探す</button>
        </div>
        <div id="results"></div>
        <div class="lang-switcher">
            <button onclick="setLang('ja')">JP</button>
            <button onclick="setLang('en')">EN</button>
        </div>
        <div id="footer-links" class="lang-switcher"></div>
        <script src="js/link-loader.js"></script>
    </div>
    <footer style="text-align:center; margin-top:20px; padding:20px; color:var(--text-sub); font-size:0.8em; border-top:1px solid rgba(255,255,255,0.1);">
        &copy; 2026 漂泊ノ海駅長
    </footer>
    <script src="js/i18n.js"></script>
    <script src="js/search.js"></script>
    <script src="js/update-status.js"></script>
    <!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "0b3aa3e40a0547d18e7687cab22830d3"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
