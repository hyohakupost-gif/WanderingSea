<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app_title">漂泊ノ海 ID照会システム</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root { --bg-color: #0b1325; --text-main: #e2e8f0; --text-sub: #94a3b8; --accent-color: #60a5fa; --card-bg: rgba(255, 255, 255, 0.05); }
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; }
        h1 { text-align: center; font-weight: 300; letter-spacing: 3px; margin-bottom: 40px; color: var(--text-main); }
        .lang-switcher { text-align: center; margin-top: 40px; margin-bottom: 20px; }
        .lang-switcher button { width: auto; padding: 8px 20px; margin: 0 5px; cursor: pointer; background: var(--card-bg); border: 1px solid var(--text-sub); color: var(--text-main); border-radius: 20px; transition: 0.3s; }
        .lang-switcher button:hover { background: var(--accent-color); color: var(--bg-color); }
        .search-box { background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); margin-bottom: 30px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #334155; border-radius: 6px; background: rgba(0, 0, 0, 0.2); color: var(--text-main); font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: var(--accent-color); color: #0b1325; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .card { background: var(--card-bg); border-left: 4px solid var(--accent-color); padding: 20px; border-radius: 8px; margin-bottom: 15px; }
        .card-id { font-size: 28px; font-weight: bold; color: var(--accent-color); margin-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 8px; display: flex; justify-content: space-between; }
        .copy-icon { font-size: 24px; color: var(--text-sub); cursor: pointer; transition: color 0.2s; user-select: none; }
        .copy-icon:hover { color: var(--text-main); }
        .card-details span { color: var(--text-sub); margin-right: 5px; display: inline-block; width: 60px; }
        .description { text-align: center; color: var(--text-sub); margin-bottom: 30px; line-height: 1.6; font-size: 0.9em; }
        .error { color: #fca5a5; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 data-i18n="app_title">漂泊ノ海 ID照会システム</h1>
        <div class="description">
            <span data-i18n="description_part1"></span><br>
            <span data-i18n="description_part2"></span><br>
            <span id="description-tail"></span>
        </div>
        <div class="search-box">
            <input type="text" id="name" data-i18n-placeholder="placeholder_name">
            <input type="text" id="title" data-i18n-placeholder="placeholder_title">
            <button onclick="search()" data-i18n="button_search">手紙を探す</button>
        </div>
        <div id="results"></div>

        <div class="lang-switcher">
            <button onclick="setLang('ja')">JP</button>
            <button onclick="setLang('en')">EN</button>
        </div>
    </div>

    <footer style="text-align: center; margin-top: 20px; padding: 20px; color: var(--text-sub); font-size: 0.8em; border-top: 1px solid rgba(255, 255, 255, 0.1);">
        &copy; 2026 漂泊ノ海駅長
    </footer>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLu7NbJI39q2DFQDR9qIbmcVamFIne5lvrJ6gxPRtkCfp2TmO69xUANcAOONZ0hW5Bzg/exec";
        let translations = {};

        // Enterキーでの検索対応
        document.getElementById('name').addEventListener('keypress', (e) => { if (e.key === 'Enter') search(); });
        document.getElementById('title').addEventListener('keypress', (e) => { if (e.key === 'Enter') search(); });

        async function loadLanguage() {
            const res = await fetch('language.json');
            translations = await res.json();
            setLang(localStorage.getItem('lang') || 'ja');
        }

        function setLang(lang) {
            localStorage.setItem('lang', lang);
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(translations[lang][key]) el.innerText = translations[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if(translations[lang][key]) el.placeholder = translations[lang][key];
            });
            const t = translations[lang];
            const linkHtml = `<a href="https://youtu.be/uoa8-pQY838?si=Fsja-1kfuoj4hcCf&t=87" target="_blank" style="color: var(--accent-color);">${t.link_how_to}</a>`;
            document.getElementById('description-tail').innerHTML = t.description_tail.replace('[link_how_to]', linkHtml);
        }

        // コピー処理
        function copyId(id, iconEl) {
            navigator.clipboard.writeText(id).then(() => {
                const original = iconEl.innerText;
                iconEl.innerText = "check";
                iconEl.style.color = "var(--accent-color)";
                setTimeout(() => { iconEl.innerText = original; iconEl.style.color = ""; }, 1500);
            });
        }

        window.addEventListener('load', loadLanguage);

        function escapeHtml(str) { return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }

async function search() {
            const lang = localStorage.getItem('lang') || 'ja';
            const name = document.getElementById('name').value.trim();
            const title = document.getElementById('title').value.trim();
            const resDiv = document.getElementById('results');

            resDiv.innerHTML = ""; // 検索結果のリセット

            if (name.length < 2 && title.length < 2) {
                resDiv.innerHTML = `<p class='error'>${translations[lang].error_input}</p>`;
                return;
            }

            resDiv.innerHTML = `<p class='message'>${translations[lang].status_searching}</p>`;
            try {
                const response = await fetch(`${SCRIPT_URL}?name=${encodeURIComponent(name)}&title=${encodeURIComponent(title)}`);
                const result = await response.json();
                
                resDiv.innerHTML = ""; // 検索中メッセージの消去

                if (result.status === "error") {
                    resDiv.innerHTML = `<p class="error">${escapeHtml(result.message)}</p>`;
                } else if (!result.data || result.data.length === 0) {
                    resDiv.innerHTML = `<p class='message'>No results found.</p>`;
                } else {
                    let html = "";
                    result.data.forEach(item => {
                        // ▼ ここで translations[lang] を参照するように修正しました ▼
                        html += `
                            <div class="card">
                                <div class="card-id">
                                    <span>${escapeHtml(item.id)}</span>
                                    <span class="material-icons copy-icon" onclick="copyId('${escapeHtml(item.id)}', this)" title="コピー">content_copy</span>
                                </div>
                                <div class="card-details">
                                    <div><span>${translations[lang].label_date}</span>${escapeHtml(item.date)}</div>
                                    <div><span>${translations[lang].label_sender}</span>${escapeHtml(item.name)}</div>
                                    <div><span>${translations[lang].label_title}</span>${escapeHtml(item.title)}</div>
                                </div>
                            </div>`;
                    });
                    resDiv.innerHTML = html;
                }
            } catch (err) { 
                resDiv.innerHTML = `<p class='error'>${translations[lang].error_connection}</p>`; 
            }
        }
    </script>
</body>
</html>
